services:
  cron:
    build:
      context: .
    command: ["supercronic", "-no-reap", "/app/scripts/crontab"]
    env_file:
      - .env.prod
    restart: always
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets

  web:
    build:
      context: .
    command: ["./scripts/start-prod.sh"]
    env_file:
      - .env.prod
    environment:
      COACH_HISTORY_PATH: /app/state/coach/chats.sqlite3
    restart: always
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
      - coach_state:/app/state
    healthcheck:
      test: ["CMD-SHELL", "curl --fail \"http://$${UVICORN_HOST}:$${UVICORN_PORT:-8000}/health\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  coach_state:
