services:
  web:
    build:
      context: .
    command: ["./scripts/start-prod.sh"]
    env_file:
      - .env.prod
    restart: always
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
    healthcheck:
      test: ["CMD-SHELL", "curl --fail \"http://$${UVICORN_HOST}:$${UVICORN_PORT:-8000}/health\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
