<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title if title else "Dia-Run" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
    {% if plotly_cdn %}
    <script src="{{ plotly_cdn }}"></script>
    {% endif %}
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand-group">
          <a class="brand" href="/">Dia-Run</a>
          <span class="badge">FastAPI dashboard</span>
        </div>
        {% if nav_items %}
        <nav class="site-nav">
          {% for item in nav_items %}
          <a href="{{ item.href }}">{{ item.label }}</a>
          {% endfor %}
        </nav>
        {% endif %}
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Data lives in ./data and stays local.</span>
        <span>Streamlit replacement in progress.</span>
      </div>
    </footer>
  </body>
</html>
