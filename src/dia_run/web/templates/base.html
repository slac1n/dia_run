<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title if title else "Dia-Run" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v=9" />
    {% if plotly_cdn %}
    <script src="{{ plotly_cdn }}"></script>
    {% endif %}
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand-group">
          <a class="brand" href="/">Dia-Run</a>
        </div>
        <nav class="site-nav">
          {% if nav_items %}
          {% for item in nav_items %}
          <a href="{{ item.href }}">{{ item.label }}</a>
          {% endfor %}
          {% endif %}
          <div class="nav-actions">
            {% if page_links %}
            {% for link in page_links %}
            <a href="{{ link.href }}" class="button button-outline button--nav">{{ link.label }}</a>
            {% endfor %}
            {% endif %}
            <form class="nav-fetch-form" action="/fetch" method="post">
              <button class="button button--nav" type="submit">Download new data</button>
            </form>
          </div>
        </nav>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Do Hard Things.</span>
        <span>{{ app_version }}</span>
      </div>
    </footer>
  </body>
</html>
