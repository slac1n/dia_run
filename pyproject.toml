[project]
name = "dia-run"
version = "0.22.0"
description = "A tool to gain insights into diabetes and running"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
  "blinker==1.7.0",
  "curlify==2.2.1",
  "deltalake>=0.23.2",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "loguru>=0.7.3",
  "packaging>=24.2",
  "pandas>=2.2.3",
  "pandera[polars]>=0.23.1",
  "plotly>=5.24.1",
  "polars>=1.19.0",
  "python-multipart>=0.0.9",
  "pyOpenSSL==24.0.0",
  "python-dotenv>=1.0.1",
  "questionary>=2.1.0",
  "Requests==2.31.0",
  "selenium-wire>=5.1.0",
  "setuptools>=75.7.0",
  "statsmodels>=0.14.4",
  "stravalib>=2.1",
  "uvicorn>=0.30.0",
  "pydantic-settings>=2.13.1",
]


[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pre-commit>=4.0.0",
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "types-requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dia_run"]

[project.scripts]
fetch = "dia_run.data_fetcher.data_fetcher:run_fetcher"
taiga = "dia_run.taiga.taiga_client:main"

[tool.ruff]
line-length = 120
exclude = [
  "src/dia_run/data_fetcher/carelink_client.py",
  "src/dia_run/data_fetcher/carelink_setup.py",
]

[tool.ruff.lint]
select = ["E", "F", "D", "B", "I", "ARG"]
ignore = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  "D203",
  "D213",
  "D417",
]
preview = true
extend-select = ["PLR0917"]

[tool.ruff.lint.pylint]
max-positional-args = 1

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = [
  "src/dia_run/data_fetcher/carelink_client\\.py$",
  "src/dia_run/data_fetcher/carelink_setup\\.py$",
]

[[tool.mypy.overrides]]
module = [
  "dia_run.data_fetcher.carelink_client",
  "dia_run.data_fetcher.carelink_setup",
]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov-config=.coveragerc"
testpaths = ["tests", "src"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
bump_message = "release $current_version → $new_version [commitizen-skip-ci]"
