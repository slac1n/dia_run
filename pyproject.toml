[project]
name = "dia-run"
version = "0.1.0"
description = "A tool to gain insights into diabetes and running"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
  "blinker==1.7.0",
  "curlify==2.2.1",
  "deltalake>=0.23.2",
  "loguru>=0.7.3",
  "packaging>=24.2",
  "pandas>=2.2.3",
  "plotly>=5.24.1",
  "polars>=1.19.0",
  "pyOpenSSL==24.0.0",
  "python-dotenv>=1.0.1",
  "Requests==2.31.0",
  "selenium-wire>=5.1.0",
  "setuptools>=75.7.0",
  "stravalib>=2.1",
]

[tool.ruff]
exclude = [".venv","__pycache__", ".pytest_cache"]
# Same as Black.
line-length = 88
indent-width = 4
target-version = "py312"  # the python version to target, useful when considering code upgrades

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint]
select = ["B", "C", "E", "F", "W", "B9", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dia_run"]

[tool.basedpyright]
typeCheckingMode = "standard"
